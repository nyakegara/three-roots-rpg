name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ThreeRoots.sln

      - name: Build solution
        run: dotnet build ThreeRoots.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ThreeRoots.sln --configuration Release --no-build
