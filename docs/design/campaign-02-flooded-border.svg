<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
<title id="title">Граница рассвета — схема карты второй кампании</title>
<desc id="desc">Большая долина с рекой, двумя бродами, южной плотиной, человеческой цитаделью на востоке и некрополем на западе. Три цвета показывают общий путь и две ветки после выбора.</desc>
